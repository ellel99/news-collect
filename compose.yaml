name: market-intelligence

x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    APP_HOST: 0.0.0.0
    DATABASE_URL: postgresql+asyncpg://market_intelligence:local_dev_only@postgres:5432/market_intelligence
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: market_intelligence
      POSTGRES_USER: market_intelligence
      POSTGRES_PASSWORD: local_dev_only
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market_intelligence -d market_intelligence"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *app
    command: ["uv", "run", "alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *app
    command: ["uv", "run", "uvicorn", "market_intelligence.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    <<: *app
    command: ["uv", "run", "celery", "-A", "market_intelligence.tasks.celery_app:celery_app", "worker", "--loglevel=INFO"]

  beat:
    <<: *app
    command: ["uv", "run", "celery", "-A", "market_intelligence.tasks.celery_app:celery_app", "beat", "--loglevel=INFO"]

volumes:
  postgres-data:
  redis-data:
